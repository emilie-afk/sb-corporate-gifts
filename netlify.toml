[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Production builds apply pending migrations + initial data to the Neon database first.
# A failure stops the deploy, so the live site never runs against an unmigrated schema.
# Deploy previews / branch deploys only build (they never touch the production database).
[context.production]
  command = "npm run db:migrate && npm run build"

[functions]
  node_bundler = "esbuild"
  # exceljs (and its jszip) are CommonJS packages with dynamic requires; they cannot be inlined into the
  # ESM bundle, so they are shipped as regular node_modules alongside the function.
  external_node_modules = ["exceljs", "jszip"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://cdn.shopify.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'"

# The SPA uses query-string navigation (?tab=pricing), so no catch-all redirect is needed.
# /api/* is served by netlify/functions/api.ts via its `config.path`.
